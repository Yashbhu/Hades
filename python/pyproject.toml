[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hades-agent"
version = "0.4.0"
description = "Local-first diagnostic client and LLM agent for Hades"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "langchain-core>=0.3,<2",
    "langchain-ollama>=0.2,<2",
    "ollama>=0.4,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
hades-agent = "hades_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hades_client = ["py.typed"]
hades_agent = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
