[package]
name = "os-agent"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first system health monitoring library and CLI with a loopback diagnostic bridge (M1-M3)"
license = "Apache-2.0"
repository = "https://github.com/Yashbhu/Hades"
readme = "README.md"
keywords = ["monitoring", "system", "metrics", "sysinfo"]
categories = ["command-line-utilities", "os"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.38.4"
tiny_http = "0.12.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
